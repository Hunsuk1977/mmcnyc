[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Old flat URLs -> folder URLs (safe to keep)
[[redirects]]
  from = "/wordalive.html"
  to = "/wordalive/"
  status = 301
[[redirects]]
  from = "/vision.html"
  to = "/vision/"
  status = 301
[[redirects]]
  from = "/about.html"
  to = "/about/"
  status = 301
[[redirects]]
  from = "/contact.html"
  to = "/contact/"
  status = 301
