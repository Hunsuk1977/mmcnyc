<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found — MMC NYC</title>
<style>
  :root { color-scheme: light }
  body { margin:0; min-height:100vh; display:grid; place-items:center; text-align:center;
         background:#fbfaf7; color:#171614; padding:24px;
         font-family:"Inter","Noto Sans KR",-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; }
  .eyebrow { font-size:.8rem; letter-spacing:.12em; font-weight:600; color:#1f4e79; margin-bottom:1rem }
  h1 { font-family:Georgia,"Noto Serif KR",serif; font-weight:500; font-size:clamp(1.8rem,5vw,2.8rem); margin:0 0 .5em }
  p { color:#4a4843; margin:0 0 1.75em }
  a { display:inline-block; padding:12px 22px; border-radius:999px; background:#171614; color:#fff;
      text-decoration:none; font-weight:600; font-size:.95rem }
</style>
</head>
<body>
<main>
  <div class="eyebrow">404</div>
  <h1>Page not found</h1>
  <p>페이지를 찾을 수 없습니다.</p>
  <a id="home" href="/">Back to home &middot; 홈으로</a>
</main>
<script>
  // Works at the domain root and under a GitHub Pages project subpath alike.
  var seg = location.pathname.split("/").filter(Boolean);
  var host = location.hostname;
  document.getElementById("home").href =
    (host.endsWith("github.io") && seg.length) ? "/" + seg[0] + "/" : "/";
</script>
</body>
</html>
